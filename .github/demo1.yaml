name: events-demo-1
on:
  pull_request:
    types: 
      - opened
  workflow_dispatch: 
  push:
    branches: [main, master, dev]  
jobs: 
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: output event data
        run: echo "${{ toJSON(github.event) }}"
      - name: get code
        uses: actions/checkout@v4 
      - name: install dependencies
        run: npm ci
      - name: test code
        run: npm run test
      - name: build code
        run: npm run build
      - name: deploy project
        run: echo "deploying ..."        